name: Update and Deploy RimaTv API

on:
  schedule:
    - cron: '15 * * * *'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch channels
        env:
          API_URL: https://iptv-za7i.onrender.com/api/v1/Channel/GetCuratedListWithStream
          APPLICATION_ID: ${{ secrets.APPLICATION_ID }}
          NONCE: ${{ secrets.NONCE }}
          SIGNATURE: ${{ secrets.SIGNATURE }}
        run: |
          set -e

          echo "Fetching channels..."

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --request GET \
            "$API_URL" \
            --header "accept: text/plain" \
            --header "ApplicationId: $APPLICATION_ID" \
            --header "Nonce: $NONCE" \
            --header "Signature: $SIGNATURE" \
            --output response.json

          echo "API response received."

      - name: Validate API response
        run: |
          set -e

          echo "Validating API response..."

          jq empty response.json

          if [ "$(jq -r 'type' response.json)" != "object" ]; then
            echo "Invalid response type."
            exit 1
          fi

          if [ "$(jq -r '.data | type' response.json)" != "array" ]; then
            echo "Invalid data format."
            exit 1
          fi

          CHANNEL_COUNT=$(jq '.data | length' response.json)

          echo "Received channels: $CHANNEL_COUNT"

          if [ "$CHANNEL_COUNT" -lt 50 ]; then
            echo "Too few channels received."
            echo "Refusing to deploy."
            exit 1
          fi

      - name: Generate channels.json
        run: |
          set -e

          mkdir -p _site

          jq '.data' response.json > _site/channels.json

          echo "Generated channels.json"

          jq empty _site/channels.json

          echo "Final channel count:"
          jq 'length' _site/channels.json

      - name: Copy index.html
        run: |
          cp index.html _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
