
name: Update and Deploy RimaTv Data

on:
  schedule:
    - cron: '15 * * * *'

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch channels
        env:
          API_URL: https://iptv-za7i.onrender.com/api/v1/Channel/GetCuratedListWithStream
          APPLICATION_ID: ${{ secrets.APPLICATION_ID }}
          NONCE: ${{ secrets.NONCE }}
          SIGNATURE: ${{ secrets.SIGNATURE }}

        run: |
          set -e

          echo "Fetching channels from API..."

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --request GET \
            "$API_URL" \
            --header "accept: text/plain" \
            --header "ApplicationId: $APPLICATION_ID" \
            --header "Nonce: $NONCE" \
            --header "Signature: $SIGNATURE" \
            --output response.json

          echo "API response received."

      - name: Validate API response
        run: |
          set -e

          echo "Validating API response..."

          jq empty response.json

          RESPONSE_TYPE=$(jq -r 'type' response.json)

          if [ "$RESPONSE_TYPE" != "object" ]; then
            echo "ERROR: API response is not an object."
            exit 1
          fi

          DATA_TYPE=$(jq -r '.data | type' response.json)

          if [ "$DATA_TYPE" != "array" ]; then
            echo "ERROR: API response does not contain a valid data array."
            exit 1
          fi

          CHANNEL_COUNT=$(jq '.data | length' response.json)

          echo "Channels received: $CHANNEL_COUNT"

          if [ "$CHANNEL_COUNT" -lt 50 ]; then
            echo "ERROR: Too few channels received."
            echo "Deployment cancelled to prevent publishing bad data."
            exit 1
          fi

      - name: Generate website
        run: |
          set -e

          rm -rf _site
          mkdir -p _site

          echo "Generating channels.json..."

          jq '.data' response.json > _site/channels.json

          echo "Copying index.html..."

          cp index.html _site/index.html

          echo "Checking generated files..."

          ls -lah _site

          echo "Channel count:"
          jq 'length' _site/channels.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

  deploy:
    runs-on: ubuntu-latest

    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
